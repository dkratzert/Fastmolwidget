[project]
name = "fastmolwidget"
dynamic = ["version"]
description = "A PyQt/PySide widget to display crystal structures"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Daniel Kratzert", email = "dkratzert@gmx.de" }
]
requires-python = ">=3.12"
keywords = ["chemistry", "crystallography", "qt", "widget", "molecule", "structure", "visualization"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Software Development :: User Interfaces",
]
dependencies = [
    "gemmi>=0.7.5",
    "numpy>=2.2.0",
    "qtpy>=2.4.3",
    "shelxfile>=25",
]

[project.optional-dependencies]
pyside6 = [
    "pyside6-essentials>=6.11.0",
]
pyqt6 = [
    "pyqt6>=6.9.0",
]
gl3d = [
    "PyOpenGL>=3.1.7",
    "PyOpenGL-accelerate>=3.1",
]
# cpp: build-time only — pybind11 must be present when running
#   pip install -e . --no-build-isolation
# macOS users also need:  brew install libomp
cpp = [
    "pybind11>=2.13",
]
# density: build-time only — pybind11 must be present when running
#   pip install -e . --no-build-isolation  (builds density_cpp, the
#   marching-cubes isosurface extension used for residual density maps)
density = [
    "pybind11>=2.13",
]

[project.urls]
Homepage = "https://github.com/dkratzert/Fastmolwidget"
Repository = "https://github.com/dkratzert/Fastmolwidget"
Issues = "https://github.com/dkratzert/Fastmolwidget/issues"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "ty",
    "pyside6-stubs",
    "pybind11>=2.13",
    "pillow>=12.2.0",
]

doc = [
    "sphinx>=8.1.3",
    "sphinx-rtd-theme",
]

[project.scripts]
fastmolwidget = "fastmolwidget:main"

[build-system]
# setuptools is used instead of uv_build because it supports C extensions
# (the optional sdm_cpp and density_cpp pybind11 modules).  pybind11, numpy,
# and wheel are build-time
# only; they are not installed into the user environment.
requires = ["setuptools>=68", "pybind11>=2.13", "numpy>=2.2.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fastmolwidget = ["qml/*.qml", "web/js/*.js", "web/js/*.md", "web/templates/*.html"]

[tool.setuptools.dynamic]
version = {attr = "fastmolwidget.__version__"}

[tool.cibuildwheel]
# Build wheels for Python 3.12, 3.13, and 3.14 on Windows, macOS, and Linux
skip = ["*-win32", "*-manylinux_i686"]
build = ["cp312-*", "cp313-*", "cp314-*"]
# Skip per-wheel testing — the dedicated `tests` job (needs: tests) already
# validates the code before release-build runs.
test-skip = "*"

[tool.cibuildwheel.macos]
# universal2 covers both arm64 and x86_64 — no separate Intel runner needed.
archs = ["universal2"]
